name: Build and Release

permissions:
  contents: write
  issues: read
  pull-requests: read
  actions: write

on:
  push:
    branches: [main]
    tags:
      - '*'
  repository_dispatch:
    types: [work-updated]

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  resolve-trigger:
    name: Resolve Trigger
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.resolve.outputs.should_build }}
      build_kind: ${{ steps.resolve.outputs.build_kind }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      is_dev: ${{ steps.resolve.outputs.is_dev }}

    steps:
      - name: Resolve source and release mode
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_REF_OVERRIDE: ${{ vars.AIONUI_SOURCE_REF }}
          PAYLOAD_BUILD_KIND: ${{ github.event.client_payload.build_kind }}
          PAYLOAD_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          PAYLOAD_SOURCE_COMMIT: ${{ github.event.client_payload.source_commit }}
          PAYLOAD_SOURCE_TAG: ${{ github.event.client_payload.source_tag }}
        run: |
          set -euo pipefail

          should_build="true"
          build_kind=""
          source_ref=""
          release_tag=""
          is_dev="false"

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            case "$PAYLOAD_BUILD_KIND" in
              dev)
                build_kind="dev"
                is_dev="true"
                source_ref="${PAYLOAD_SOURCE_REF:-$PAYLOAD_SOURCE_COMMIT}"
                ;;
              release)
                build_kind="release"
                is_dev="false"
                source_ref="${PAYLOAD_SOURCE_REF:-$PAYLOAD_SOURCE_TAG}"
                release_tag="${PAYLOAD_SOURCE_TAG:-$source_ref}"
                if [[ "$release_tag" == *-dev-* ]]; then
                  should_build="false"
                fi
                ;;
              *)
                echo "::error::Unsupported repository_dispatch build_kind: ${PAYLOAD_BUILD_KIND:-<empty>}"
                exit 1
                ;;
            esac
          elif [ "$REF" = "refs/heads/main" ]; then
            build_kind="dev"
            is_dev="true"
            source_ref="${SOURCE_REF_OVERRIDE:-$REF_NAME}"
          elif [[ "$REF" == refs/tags/* ]]; then
            release_tag="$REF_NAME"
            if [[ "$release_tag" == *-dev-* ]]; then
              should_build="false"
              build_kind="skip"
              source_ref="${SOURCE_REF_OVERRIDE:-main}"
            else
              build_kind="release"
              is_dev="false"
              source_ref="${SOURCE_REF_OVERRIDE:-main}"
            fi
          else
            echo "::error::Unsupported trigger: $EVENT_NAME / $REF"
            exit 1
          fi

          if [ "$should_build" = "true" ] && [ -z "$source_ref" ]; then
            echo "::error::Resolved source_ref is empty"
            exit 1
          fi

          if [ "$should_build" = "true" ] && [ "$build_kind" = "release" ] && [ -z "$release_tag" ]; then
            echo "::error::Resolved release_tag is empty"
            exit 1
          fi

          {
            echo "should_build=$should_build"
            echo "build_kind=$build_kind"
            echo "source_ref=$source_ref"
            echo "release_tag=$release_tag"
            echo "is_dev=$is_dev"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved trigger"
            echo ""
            echo "- Should build: \`$should_build\`"
            echo "- Build kind: \`$build_kind\`"
            echo "- Source ref: \`${source_ref:-<none>}\`"
            echo "- Release tag: \`${release_tag:-<none>}\`"
            echo "- Is dev: \`$is_dev\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # 独立 code-quality job,供桌面构建和 web-cli 打包共用,避免重复跑
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: resolve-trigger
    if: needs.resolve-trigger.outputs.should_build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch private source
        shell: bash
        env:
          AIONUI_SOURCE_REPO_URL: ${{ vars.AIONUI_SOURCE_REPO_URL || 'https://github.com/village-way/zhanlu-work.git' }}
          AIONUI_SOURCE_REF: ${{ needs.resolve-trigger.outputs.source_ref }}
          AIONUI_SOURCE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash scripts/fetch-private-source.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build-pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/_build-reusable.yml
    needs: [resolve-trigger, code-quality]
    if: needs.resolve-trigger.outputs.should_build == 'true' && needs.code-quality.result == 'success'
    with:
      skip_code_quality: true
      source_ref: ${{ needs.resolve-trigger.outputs.source_ref }}
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      IDENTITY: ${{ secrets.IDENTITY }}
      APP_ID: ${{ secrets.APP_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  pack-web-cli:
    name: Pack Web CLI
    uses: ./.github/workflows/pack-web-cli.yml
    needs: [resolve-trigger, code-quality]
    if: needs.resolve-trigger.outputs.should_build == 'true' && needs.code-quality.result == 'success'
    with:
      ref: ''
      source_ref: ${{ needs.resolve-trigger.outputs.source_ref }}
      append_commit_hash: false
      skip_code_quality: true
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 自动重试 workflow（当构建失败时）
  auto-retry-workflow:
    name: Auto Retry on Build Failure
    runs-on: ubuntu-latest
    needs: build-pipeline
    # 关键：只在首次失败时触发，避免无限循环
    if: |
      failure() &&
      github.run_attempt == 1 &&
      (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule')

    steps:
      - name: Log retry information
        run: |
          echo "=========================================="
          echo "🔄 Auto retry triggered (first failure)"
          echo "=========================================="
          echo "Build failed on first attempt, preparing auto retry..."
          echo "Current attempt: ${{ github.run_attempt }}"
          echo "Wait strategy: 5 minutes cooldown before retry"
          echo "=========================================="

      - name: Wait before retry (5 min cooldown)
        run: |
          echo "⏳ Waiting 5 minutes before retry..."
          echo "Start: $(date)"
          sleep 300
          echo "End: $(date)"
          echo "Triggering retry..."

      - name: Trigger workflow rerun
        run: |
          echo "🔄 Triggering full workflow rerun (attempt 2)..."

          # Use re-run API (not rerun-failed-jobs, to avoid loops)
          response=$(curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -w "\n%{http_code}" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun)

          http_code=$(echo "$response" | tail -n1)

          if [ "$http_code" = "201" ]; then
            echo ""
            echo "✅ Retry triggered successfully"
            echo "This will be attempt 2"
            echo "Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo ""
            echo "❌ Retry trigger failed, HTTP status: $http_code"
            echo "Response:"
            echo "$response" | head -n-1
            exit 1
          fi

  prepare-release-ref:
    name: Prepare Release Ref
    runs-on: ubuntu-latest
    needs: [resolve-trigger, build-pipeline]
    if: needs.resolve-trigger.outputs.should_build == 'true' && needs.build-pipeline.result == 'success'
    outputs:
      tag_name: ${{ steps.prepare_tag.outputs.tag_name }}
      is_dev: ${{ steps.prepare_tag.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # GH_TOKEN is a PAT with `repo` + `workflow` scopes — required because
          # tag pushes whose reachable history contains .github/workflows/
          # changes are rejected for the built-in GITHUB_TOKEN (lacks the
          # `workflow` scope, which GITHUB_TOKEN can never grant).
          token: ${{ secrets.GH_TOKEN }}

      - name: Fetch private source
        if: needs.resolve-trigger.outputs.is_dev == 'true'
        shell: bash
        env:
          AIONUI_SOURCE_REPO_URL: ${{ vars.AIONUI_SOURCE_REPO_URL || 'https://github.com/village-way/zhanlu-work.git' }}
          AIONUI_SOURCE_REF: ${{ needs.resolve-trigger.outputs.source_ref }}
          AIONUI_SOURCE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash scripts/fetch-private-source.sh

      - name: Setup Node.js
        if: needs.resolve-trigger.outputs.is_dev == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare and push release tag
        id: prepare_tag
        shell: bash
        run: |
          set -euo pipefail

          IS_DEV="${{ needs.resolve-trigger.outputs.is_dev }}"
          RELEASE_TAG="${{ needs.resolve-trigger.outputs.release_tag }}"
          SOURCE_REF="${{ needs.resolve-trigger.outputs.source_ref }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if [ "$IS_DEV" = "true" ]; then
            : "${AIONUI_SOURCE_COMMIT:?AIONUI_SOURCE_COMMIT is required for dev tag creation}"
            SOURCE_SHORT="${AIONUI_SOURCE_COMMIT:0:7}"
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}-dev-${SOURCE_SHORT}"
            echo "🔧 Development release: $TAG_NAME"
          else
            : "${RELEASE_TAG:?release tag is required}"
            TAG_NAME="$RELEASE_TAG"
            echo "🚀 Stable release: $TAG_NAME"
          fi

          REMOTE_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}" "refs/tags/${TAG_NAME}^{}" | awk -v tag="refs/tags/${TAG_NAME}" '$2 == tag "^{}" { peeled = $1 } $2 == tag { base = $1 } END { print peeled ? peeled : base }')"

          if [ -n "$REMOTE_TAG_SHA" ]; then
            if [ "$REMOTE_TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::Tag $TAG_NAME already exists at $REMOTE_TAG_SHA, expected $HEAD_SHA"
              exit 1
            fi
            echo "Tag $TAG_NAME already exists at current commit; reusing it."
          else
            echo "Creating tag: $TAG_NAME"
            git tag "$TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
            echo "✅ Successfully created and pushed tag: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_dev=$IS_DEV" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 发布到 GitHub Releases
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [resolve-trigger, build-pipeline, prepare-release-ref, pack-web-cli]
    if: always() && needs.resolve-trigger.outputs.should_build == 'true' && needs.build-pipeline.result == 'success' && needs.pack-web-cli.result == 'success' && needs.prepare-release-ref.result == 'success'
    # main 分支开发版本使用 dev-release 环境，正式 tag 使用 release 环境
    environment: ${{ needs.prepare-release-ref.outputs.is_dev == 'true' && 'dev-release' || 'release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Fetch private source
        shell: bash
        env:
          AIONUI_SOURCE_REPO_URL: ${{ vars.AIONUI_SOURCE_REPO_URL || 'https://github.com/village-way/zhanlu-work.git' }}
          AIONUI_SOURCE_REF: ${{ needs.resolve-trigger.outputs.source_ref }}
          AIONUI_SOURCE_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash scripts/fetch-private-source.sh

      - name: Get version for release
        id: version
        run: |
          TAG_NAME="${{ needs.prepare-release-ref.outputs.tag_name }}"
          IS_DEV="${{ needs.prepare-release-ref.outputs.is_dev }}"

          if [ "$IS_DEV" = "true" ]; then
            echo "🔧 Creating development release: $TAG_NAME"
          else
            echo "🚀 Creating stable release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_dev == 'true' && format('Development Build {0}', steps.version.outputs.tag_name) || steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.tar.gz
            release-assets/**/*.sha256
            release-assets/install-web.sh
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.version.outputs.is_dev == 'true' || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
