name: 'PR Checks'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run skeleton checks on'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, edited, closed, ready_for_review]
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  cancel-if-closed:
    name: Cancel if PR closed
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed, cancelling in-progress runs via concurrency."

  skeleton-check:
    name: Public Skeleton Check
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve PR context
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/checkout-pr
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ github.token }}

      - name: Validate bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/fetch-private-source.sh
          bash -n scripts/fetch-private-source.sh

          if [ -f scripts/sync-public-skeleton.sh ]; then
            bash -n scripts/sync-public-skeleton.sh
          fi

      - name: Validate public skeleton layout
        if: github.repository == 'village-way/AionUi'
        shell: bash
        run: |
          set -euo pipefail

          forbidden_paths=(
            package.json
            bun.lock
            packages
            mobile
            tests
            examples
            resources
          )

          failed=0
          for path in "${forbidden_paths[@]}"; do
            if [ -e "$path" ]; then
              echo "::error title=Private implementation path present::$path must not exist in the public skeleton repository."
              failed=1
            fi
          done

          exit "$failed"

  # Job 4: Build test across representative PR platforms (private-source workflow compatibility only)
  build-test:
    name: Build Test (${{ matrix.platform }})
    if: ${{ false }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-arm64'
            os: 'macos-14'
          - platform: 'windows-x64'
            os: 'windows-2022'
          - platform: 'linux-x64'
            os: 'ubuntu-latest'
    steps:
      - name: Skip public PR build test
        run: echo "Public skeleton PR checks do not fetch private source or run package builds."

  # Job 5: Test release scripts
